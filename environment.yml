# Constrained SMINA docking -- reproducible environment
#
#   conda env create -f environment.yml
#   conda activate constrained-docking
#
# Everything the pipeline needs lives in this one environment: the SMINA binary,
# Open Babel for protonation, and RDKit for conformer work. The scripts are kept
# Python 3.8 compatible on purpose so they run here directly, rather than having
# to shell across environments to reach SMINA.
#
# Verified on macOS arm64 with smina 2020.12.10, Open Babel 3.1.0,
# RDKit 2023.09.6, pandas 2.0.3, numpy 1.24.4, Python 3.8.20.
#
# mamba is considerably faster if you have it:
#   mamba env create -f environment.yml

name: constrained-docking

channels:
  - conda-forge

dependencies:
  - python>=3.8

  # --- docking ---
  - smina>=2020.12

  # --- cheminformatics ---
  - rdkit>=2022.09
  - openbabel>=3.1        # protonation via `obabel -p`

  # --- data ---
  - pandas>=1.3
  - numpy>=1.20

  # --- optional ---
  # PyMOL sessions are always written as .pml scripts. Installing PyMOL also
  # renders them to .pse automatically. The pipeline never imports pymol, it
  # only shells out to the binary, so a PyMOL in a different environment (or
  # from Homebrew) works fine too -- point at it with --pymol-path.
  # - pymol-open-source
